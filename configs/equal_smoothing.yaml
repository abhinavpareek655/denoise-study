# Equal-smoothing sweep grids, DECLARED IN ADVANCE (commit before running; descriptive analysis only,
# nothing is tuned). One main smoothing parameter per classical method; other parameters stay at the
# calibrated (frozen) values for that sigma. Bilateral axis = RANGE sigma (spatial stays calibrated).
sweeps:
  gaussian: {param: sigma_px,    values: [0.4, 0.6, 0.8, 1.0, 1.25, 1.5, 2.0, 2.5, 3.0, 4.0]}
  bilateral: {param: sigma_r_255, values: [10, 20, 30, 45, 60, 80, 110, 150, 200]}
  tv: {param: weight,            values: [0.03, 0.05, 0.08, 0.12, 0.16, 0.22, 0.30, 0.40, 0.55]}
  nlm: {param: h,                values: [0.03, 0.05, 0.08, 0.11, 0.15, 0.20, 0.27, 0.35]}
